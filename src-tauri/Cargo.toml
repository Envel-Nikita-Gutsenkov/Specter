[package]
name = "specter"
version = "0.1.0"
edition = "2021"
description = "The Zero-Disk-Load Instant Replay Buffer & Screen Capture Engine for Windows"
authors = ["Nikita Gutsenkov"]
license = "MIT"
repository = "https://github.com/Envel-Nikita-Gutsenkov/Specter"
readme = "../README.md"

[lib]
name = "specter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }
